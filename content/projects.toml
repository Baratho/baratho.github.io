[[items]]
title = "Convergence Acceleration for DiffusionDet"
date = "2025"
content = "Introduced a heatmap-based detection head and loss for training on the PROPS dataset. Early-stage AP improved by approximately 10 points at 1,000 iterations, and mean per-category AP rose from 62.85 to 69.37."
tags = ["Object detection", "Computer vision", "Deep learning"]

