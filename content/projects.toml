[[items]]
title = "Exploring Cross-Participant Transfer in Intracortical Phoneme Decoding"
date = "Sep - Dec 2025"
content = "Explored whether a GRU-CTC phoneme decoder pretrained on participant t15 could adapt to intracortical neural recordings from participant t13. Investigated loss-function and architectural modifications by implementing Focal-CTC with gamma warm-up and training diagnostics in PyTorch, and prototyping a Conformer-CTC encoder. Fine-tuning yielded only limited performance improvement (approximately 1% relative) on the target participant's data, highlighting the challenges of transferring learned neural representations across individuals."
tags = ["PyTorch", "Neural decoding", "Transfer learning"]

[[items]]
title = "Reservoir Computing for Autonomous Control"
date = "2025"
content = "Developed an Echo State Network controller for a beam balance task using PID-generated training data. A reservoir of approximately 700 units achieved stabilization comparable to the PID baseline in simulation; robustness was evaluated under unseen initial conditions and external perturbations."
tags = ["Reservoir computing", "Control", "ReservoirPy"]

